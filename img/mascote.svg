<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Stoqzy">
  <!-- Rato F: sem fundo (mascote solta para o site), contorno carvão à autocolante, cabeça em pera, etiqueta pendurada na orelha. -->
  <g stroke="#14161C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- cauda -->
    <path d="M47 47c8 2 12-3 9-7s-8-2-7 2 6 5 10 3" fill="none" stroke="#14161C" stroke-width="5.4"/>
    <path d="M47 47c8 2 12-3 9-7s-8-2-7 2 6 5 10 3" fill="none" stroke="#F5B942" stroke-width="2.6"/>
    <!-- orelhas -->
    <circle cx="15.5" cy="16.5" r="11.5" fill="#F5B942"/>
    <circle cx="48.5" cy="16.5" r="11.5" fill="#F5B942"/>
    <circle cx="15.5" cy="16.5" r="5.5" fill="#FBF7EE" stroke="none"/>
    <circle cx="48.5" cy="16.5" r="5.5" fill="#FBF7EE" stroke="none"/>
    <!-- cabeça em pera -->
    <path d="M32 13c12.5 0 22 8.2 22 18.5 0 6.5-3.8 11.8-9.5 15.3L32 54.5l-12.5-7.7C13.8 43.3 10 38 10 31.5 10 21.2 19.5 13 32 13z" fill="#F5B942"/>
    <!-- focinho -->
    <path d="M32 34.5c6.5 0 11 3.5 11 8 0 4.2-4.5 7.8-11 9.3-6.5-1.5-11-5.1-11-9.3 0-4.5 4.5-8 11-8z" fill="#FBF7EE" stroke="none"/>
    <!-- olhos -->
    <circle cx="24" cy="31" r="3.2" fill="#14161C" stroke="none"/>
    <circle cx="40" cy="31" r="3.2" fill="#14161C" stroke="none"/>
    <circle cx="25.1" cy="29.9" r="1" fill="#FBF7EE" stroke="none"/>
    <circle cx="41.1" cy="29.9" r="1" fill="#FBF7EE" stroke="none"/>
    <!-- nariz + boca -->
    <ellipse cx="32" cy="40.5" rx="2.8" ry="2.1" fill="#14161C" stroke="none"/>
    <path d="M28.3 44.6c1.3 1.5 2.5 2.1 3.7 2.1s2.4-.6 3.7-2.1" fill="none" stroke="#14161C" stroke-width="1.8"/>
    <!-- bigodes -->
    <path d="M20 40.5l-8-1.5M20 43.5l-8 1.5M44 40.5l8-1.5M44 43.5l8 1.5" fill="none" stroke="#14161C" stroke-width="1.6"/>
    <!-- etiqueta pendurada na orelha direita -->
    <g transform="rotate(20 55 26)">
      <path d="M51 22h6l3 3v8a1.5 1.5 0 0 1-1.5 1.5H51A1.5 1.5 0 0 1 49.5 33v-9.5A1.5 1.5 0 0 1 51 22z" fill="#FBF7EE" stroke-width="2"/>
      <circle cx="53" cy="25" r="1.1" fill="#14161C" stroke="none"/>
    </g>
  </g>
</svg>
